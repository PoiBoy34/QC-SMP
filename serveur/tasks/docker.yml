---
# Docker Engine + Compose depuis le dépôt officiel de Docker.

- name: Dossier des clés APT
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Clé du dépôt Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Dépôt Docker
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/debian
      Suites: {{ ansible_distribution_release }}
      Components: stable
      Architectures: {{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}
      Signed-By: /etc/apt/keyrings/docker.asc

- name: Installer Docker
  ansible.builtin.apt:
    update_cache: true
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Rotation des journaux des conteneurs (évite de remplir le disque)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: |
      {
        "log-driver": "local",
        "log-opts": { "max-size": "20m", "max-file": "5" }
      }
  notify: redemarrer docker

- name: Docker actif au démarrage
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: L'utilisateur de la VM peut utiliser docker sans sudo
  ansible.builtin.user:
    name: "{{ vm_user }}"
    groups: docker
    append: true

- name: Appliquer la config Docker avant de lancer les conteneurs
  ansible.builtin.meta: flush_handlers
