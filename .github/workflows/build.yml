name: Build & release

# Publie une release quand la version du launcher change : modifie "version" dans
# minecraft-launcher/package.json (même directement sur github.com) et pousse sur main.
# Pousser un tag v1.0.1, ou lancer le workflow depuis l'onglet Actions, marche aussi.
# Une version déjà publiée n'est jamais reconstruite.
on:
  push:
    branches: [main]
    paths:
      - 'minecraft-launcher/package.json'
      - '.github/workflows/build.yml'
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      nouvelle: ${{ steps.v.outputs.nouvelle }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(jq -r .version minecraft-launcher/package.json)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null | grep -qx false; then
            echo "La release $tag est déjà publiée : rien à construire."
            echo "nouvelle=false" >> "$GITHUB_OUTPUT"
          else
            echo "nouvelle=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.nouvelle == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: minecraft-launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Signature Windows (Azure Artifact Signing) -----------------
          # Décommente ces trois lignes le jour où tu as un compte de
          # signature, et ajoute azureSignOptions dans package.json.
          # AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          # AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          # AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

  # Les deux runners publient dans la même release brouillon, et Linux finit environ
  # une minute avant Windows. On ne la rend publique qu'une fois les 5 fichiers présents :
  # publiée trop tôt, la release ne laisse plus au .exe d'endroit où atterrir.
  publier:
    needs: [version, build]
    if: needs.version.outputs.nouvelle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Vérifier les 5 fichiers puis publier la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          version="${TAG#v}"
          attendus=(
            "LQDM-Launcher-Setup-$version.exe"
            "LQDM-Launcher-Setup-$version.exe.blockmap"
            "latest.yml"
            "LQDM-Launcher-$version.AppImage"
            "latest-linux.yml"
          )
          presents=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          manque=0
          for f in "${attendus[@]}"; do
            if grep -qxF "$f" <<<"$presents"; then echo "ok : $f"; else echo "MANQUE : $f"; manque=1; fi
          done
          if [ "$manque" != 0 ]; then
            echo "::error::Release laissée en brouillon : il manque des fichiers."
            exit 1
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "Release $TAG publiée : les launchers installés vont proposer la mise à jour."
